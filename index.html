    <title>Daily Surprise Roll - 100 Days of Love</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .day-badge {
            background: #ffe3e3;
            color: #d63384;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
        }

        /* Paper Roll Animation Container */
        .box-wrapper {
            perspective: 1000px;
            margin: 30px 0;
        }

        .paper-roll {
            background: #fffdf0;
            border: 2px dashed #e6c280;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.6s ease, max-height 0.8s ease, opacity 0.5s;
            max-height: 80px;
            overflow: hidden;
            position: relative;
        }

        .paper-roll::before {
            content: "📜 Tap To Reveal 🎀";
            display: block;
            color: #b37d14;
            font-weight: bold;
            font-size: 16px;
        }

        .paper-roll.open {
            max-height: 300px;
            background: #ffffff;
            border: 2px solid #ff85a2;
            transform: rotateX(0deg) scale(1.05);
        }

        .paper-roll.open::before {
            display: none;
        }

        .message-text {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease 0.3s;
            color: #4a4a4a;
            font-size: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .paper-roll.open .message-text {
            opacity: 1;
            transform: translateY(0);
        }

        .lock-msg {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .heart {
            color: #ff4d6d;
            font-size: 22px;
        }
    </style>
</head>

<script>
const playlist = [
  "en roja.mp3",
  "aathi.mp3",
  "kalyani.mp3",
  "kalyani mix.mp3",
  "kannukulla.mp3",
  "kurunmgli.mp3",
  "pesamale.mp3"
];

const randomIndex = Math.floor(Math.random() * playlist.length);
const selectedSong = playlist[randomIndex];

const music = document.getElementById('bgMusic');
if (music) {
  music.src = selectedSong;
}

document.body.addEventListener('click', () => {
    if (music && music.paused) {
        music.play().catch(error => console.log("Audio play error:", error));
}, { once: true });
</script>

        // நாள்களை கணக்கிடுதல் (Daily Lock Logic)
        const startDateKey = 'roll_start_date';
        let startDate = localStorage.getItem(startDateKey);

        if (!startDate) {
            startDate = new Date().getTime();
            localStorage.setItem(startDateKey, startDate);
        }

        const now = new Date().getTime();
        const diffDays = Math.floor((now - startDate) / (1000 * 60 * 60 * 24)) + 1;
        const currentDayIndex = Math.min(diffDays, 100) ;

        document.getElementById('dayCounter').innerText = `Day ${currentDayIndex + 1} / 100`;

        function openRoll() {
            const roll = document.getElementById('paperRoll');
            const msgBox = document.getElementById('messageBox');
            const lockMsg = document.getElementById('lockMsg');

            // Set current message
            msgBox.innerText = messages[currentDayIndex] || "100 நாட்களின் அன்புச் செய்திகள் நிறைவடைந்தன! ❤️";
            
            // Open animation
            roll.classList.add('open');
            
            setTimeout(() => {
                lockMsg.style.display = 'block';
            }, 800);
    </script>
